<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DanmakuPlayer Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="header">
        <img src="icons/icon48.png" alt="icon" class="logo" />
        <div class="title-area">
          <h1>DanmakuPlayer Helper</h1>
          <span class="version">v1.2.0</span>
        </div>
        <button id="help-btn" class="icon-btn" title="ヘルプ">❓</button>
      </header>

      <section class="section">
        <h2>📺 このページを開く</h2>
        <button id="open-page" class="btn btn-primary">
          現在のページをDanmakuPlayerで開く
        </button>
      </section>

      <section class="section" id="hls-section">
        <h2>🎬 検出されたHLSストリーム</h2>
        <div id="hls-list" class="hls-list">
          <p class="empty-message">検出中...</p>
        </div>
      </section>

      <section class="section">
        <h2>⚙️ 設定</h2>
        <div class="setting-row">
          <label for="prefer-production">本番環境を優先</label>
          <input type="checkbox" id="prefer-production" />
        </div>
      </section>

      <footer class="footer">
        <a href="https://yossyaze.github.io/DanmakuPlayer/" target="_blank"
          >DanmakuPlayerを開く</a
        >
      </footer>

      <!-- Help Overlay -->
      <div id="help-overlay" class="help-overlay hidden">
        <div class="help-content">
          <div class="help-header">
            <h2>使い方ガイド</h2>
            <button id="close-help-btn" class="close-btn">✖</button>
          </div>
          <div class="help-body">
            <h3>📺 このページを開く</h3>
            <p>現在見ているウェブページをDanmakuPlayerで開きます。Youtubeやニコニコ動画のURLに対応しています。</p>
            
            <h3>🎬 HLSストリーム検出</h3>
            <p>ページ内の動画(m3u8)を自動検出します。リストをクリックするとプレイヤーで再生できます。</p>
            
            <h3>⚙️ 設定</h3>
            <p>「本番環境を優先」: 開発版(localhost)ではなく、公開版のプレイヤーで開くようにします。</p>
          </div>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
