name: Deploy to GitHub Pages

# mainブランチへのプッシュ時に自動実行
on:
  push:
    branches:
      - main
  # 手動実行（GitHubのActionsタブから手動トリガー）も可能にする
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの制御（進行中のデプロイがある場合はキューイング）
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci --legacy-peer-deps

      - name: プロダクションビルド
        run: npm run build

      - name: Pages 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
