name: Deploy to GitHub Pages

# mainブランチへのプッシュ時に自動実行
on:
  push:
    branches:
      - main
  # 手動実行（GitHubのActionsタブから手動トリガー）も可能にする
  workflow_dispatch:

# GITHUB_TOKEN に gh-pages ブランチへの書き込み権限を付与
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: プロダクションビルド
        run: npm run build

      - name: gh-pages ブランチへデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
